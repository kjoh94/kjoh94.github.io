<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <rect width="900" height="460" fill="#f4f7fb"/>
  <text x="36" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">돌곶이 → 노원기차마을 · 화랑대 철도공원</text>
  <text x="36" y="72" font-family="sans-serif" font-size="14" fill="#666">6호선 직행 · 10시 반 출발 · 6시 귀가</text>

  <g font-family="sans-serif" font-size="15" fill="#222">
    <circle cx="90" cy="170" r="20" fill="#c45c26"/>
    <text x="90" y="175" text-anchor="middle" fill="#fff" font-size="12">6</text>
    <text x="90" y="210" text-anchor="middle">돌곶이</text>

    <line x1="110" y1="170" x2="250" y2="170" stroke="#888" stroke-width="4"/>
    <text x="180" y="155" text-anchor="middle" font-size="12" fill="#666">석계·태릉입구</text>

    <circle cx="280" cy="170" r="20" fill="#1f6feb"/>
    <text x="280" y="175" text-anchor="middle" fill="#fff" font-size="11">화</text>
    <text x="280" y="210" text-anchor="middle">화랑대</text>
    <text x="280" y="228" text-anchor="middle" font-size="12" fill="#666">도보 10–17분</text>

    <line x1="300" y1="170" x2="430" y2="170" stroke="#c45c26" stroke-width="4" stroke-dasharray="6 4"/>

    <rect x="430" y="120" width="200" height="90" rx="12" fill="#fff" stroke="#1f6feb" stroke-width="3"/>
    <text x="530" y="155" text-anchor="middle" font-weight="700">노원기차마을</text>
    <text x="530" y="178" text-anchor="middle" font-size="12" fill="#666">스위스관 · 이탈리아관</text>
    <text x="530" y="198" text-anchor="middle" font-size="12" fill="#666">10–19시 (월 휴관)</text>

    <line x1="530" y1="210" x2="530" y2="270" stroke="#3d7a4a" stroke-width="3"/>
    <rect x="390" y="270" width="280" height="110" rx="12" fill="#e8f5e9" stroke="#3d7a4a" stroke-width="2"/>
    <text x="530" y="300" text-anchor="middle" font-weight="700">같은 공원에서 더</text>
    <text x="530" y="325" text-anchor="middle" font-size="13">철길·실물 기차 · 트램도서관</text>
    <text x="530" y="348" text-anchor="middle" font-size="13">카페(미니기차 배달) · 타임뮤지엄</text>
    <text x="530" y="370" text-anchor="middle" font-size="12" fill="#666">공원 야외는 무료 · 연중</text>
  </g>

  <text x="36" y="430" font-family="sans-serif" font-size="13" fill="#888">점심: 공릉 경복식당(백반) / 화랑대 안성희 순대국 · 귀가 ~16시 출발</text>
</svg>
