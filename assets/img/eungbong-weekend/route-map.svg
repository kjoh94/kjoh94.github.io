<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#f7f4ef"/>
  <text x="40" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#222">돌곶이 → 응봉산 팔각정 동선</text>
  <text x="40" y="78" font-family="sans-serif" font-size="14" fill="#666">지하철 약 35–45분 + 도보 10–15분</text>
  <g font-family="sans-serif" font-size="16" fill="#111">
    <circle cx="80" cy="200" r="18" fill="#c45c26"/>
    <text x="80" y="205" text-anchor="middle" fill="#fff" font-size="12">6</text>
    <text x="80" y="250" text-anchor="middle">돌곶이</text>
    <line x1="98" y1="200" x2="210" y2="200" stroke="#888" stroke-width="4"/>
    <circle cx="230" cy="200" r="18" fill="#3d7a4a"/>
    <text x="230" y="205" text-anchor="middle" fill="#fff" font-size="12">환</text>
    <text x="230" y="250" text-anchor="middle">신당</text>
    <text x="230" y="270" text-anchor="middle" font-size="12" fill="#666">→ 2호선</text>
    <line x1="248" y1="200" x2="360" y2="200" stroke="#888" stroke-width="4"/>
    <circle cx="380" cy="200" r="18" fill="#3d7a4a"/>
    <text x="380" y="205" text-anchor="middle" fill="#fff" font-size="12">환</text>
    <text x="380" y="250" text-anchor="middle">왕십리</text>
    <text x="380" y="270" text-anchor="middle" font-size="12" fill="#666">→ 경의·중앙</text>
    <line x1="398" y1="200" x2="510" y2="200" stroke="#888" stroke-width="4"/>
    <circle cx="530" cy="200" r="18" fill="#1f6feb"/>
    <text x="530" y="205" text-anchor="middle" fill="#fff" font-size="12">1</text>
    <text x="530" y="250" text-anchor="middle">응봉</text>
    <text x="530" y="270" text-anchor="middle" font-size="12" fill="#666">1번 출구</text>
    <line x1="548" y1="200" x2="660" y2="160" stroke="#c45c26" stroke-width="4" stroke-dasharray="6 4"/>
    <rect x="660" y="120" width="180" height="70" rx="12" fill="#fff" stroke="#c45c26" stroke-width="3"/>
    <text x="750" y="150" text-anchor="middle" font-weight="700">팔각정</text>
    <text x="750" y="172" text-anchor="middle" font-size="13" fill="#666">도보 20–35분</text>
    <line x1="750" y1="190" x2="750" y2="280" stroke="#3d7a4a" stroke-width="3" stroke-dasharray="4 4"/>
    <rect x="640" y="290" width="200" height="70" rx="12" fill="#e8f5e9" stroke="#3d7a4a" stroke-width="2"/>
    <text x="740" y="320" text-anchor="middle" font-weight="700">서울숲 (선택)</text>
    <text x="740" y="342" text-anchor="middle" font-size="13" fill="#666">용비교 도보 20–40분</text>
  </g>
  <text x="40" y="390" font-family="sans-serif" font-size="13" fill="#888">점심: 성수 말방국밥 / 능동미나리 · 귀가 ~17시 출발</text>
